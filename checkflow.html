<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAL Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--sf:#fff;--bd:rgba(0,0,0,.08);--bds:rgba(0,0,0,.2);
  --tx:#0d0d0d;--mu:#666;--li:#bbb;--ac:#0d0d0d;--ach:#333;
  --dg:#c0392b;--dgb:#fdf0ef;--bl:#1a73e8;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0d0d0d;--sf:#181818;--bd:rgba(255,255,255,.08);--bds:rgba(255,255,255,.25);
  --tx:#f0f0f0;--mu:#999;--li:#555;--ac:#f0f0f0;--ach:#ccc;--dg:#e74c3c;--dgb:#2a1010}
}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.auth-box{background:var(--sf);border:1px solid var(--bds);padding:2.5rem;width:100%;max-width:380px}
.auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--bds)}
.auth-logo img{height:32px}
@media(prefers-color-scheme:dark){.auth-logo img{filter:invert(1)}}
.auth-logo-div{width:1px;height:26px;background:var(--bds)}
.auth-logo-sub{font-size:10px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:var(--mu)}
.auth-tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--bds)}
.auth-tab{flex:1;padding:8px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mu);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s}
.auth-tab.active{color:var(--tx);border-bottom-color:var(--ac)}
.auth-err{font-size:11px;color:var(--dg);margin-bottom:1rem;padding:8px 12px;background:var(--dgb);display:none}
.auth-err.show{display:block}

/* FORMS */
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.fg input,.fg textarea,.fg select{width:100%;border:1px solid var(--bds);background:var(--bg);color:var(--tx);
  font-size:13px;padding:0 12px;outline:none;font-family:inherit}
.fg input,.fg select{height:38px}
.fg textarea{padding:10px 12px;resize:vertical;min-height:70px;line-height:1.5}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--ac)}
.fg select{cursor:pointer}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--bds);
  background:transparent;color:var(--tx);font-size:10px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{border-color:var(--ac);background:var(--ac);color:var(--sf);justify-content:center}
.btn-p:hover:not(:disabled){background:var(--ach);border-color:var(--ach)}
#auth-btn{width:100%;padding:11px}
.btn-sm{padding:5px 12px;font-size:9px}

/* HEADER */
#app{display:none}
header{background:var(--sf);border-bottom:1px solid var(--bds);padding:0 2rem;height:72px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.lw{display:flex;align-items:center;gap:18px}
.li{height:38px}
@media(prefers-color-scheme:dark){.li{filter:invert(1)}}
.ld{width:1px;height:32px;background:var(--bds)}
.ls{font-size:11px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:var(--mu)}
.hr{display:flex;align-items:center;gap:12px}
.clk{font-size:11px;font-weight:300;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.sync{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.sync.saving{color:var(--bl)}.sync.saved{color:#1a8a5a}.sync.err{color:var(--dg)}
.user-em{font-size:11px;color:var(--mu);font-weight:300}

/* TABS */
nav{background:var(--sf);border-bottom:1px solid var(--bds);padding:0 2rem;display:flex;gap:0}
.tab{padding:10px 20px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mu);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s}
.tab.active{color:var(--tx);border-bottom-color:var(--ac)}
.tab:hover{color:var(--tx)}

/* MAIN */
main{max-width:1300px;margin:0 auto;padding:2.5rem 2rem}
.view{display:none}.view.active{display:block}
.stitle{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);
  padding-bottom:1rem;border-bottom:1px solid var(--bds);margin-bottom:1.5rem;display:flex;align-items:flex-end;justify-content:space-between}
.ssub{font-size:13px;font-weight:300;color:var(--mu);margin-top:4px;letter-spacing:.04em;text-transform:none}

/* TAG FILTER */
.tag-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.tag-pill{padding:4px 12px;border:1px solid var(--bds);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;transition:all .15s;background:transparent;color:var(--mu);font-family:inherit}
.tag-pill.active{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.tag-pill:hover{border-color:var(--ac);color:var(--tx)}

/* GRID */
.grid{display:flex;gap:1.25rem;overflow-x:auto;padding-bottom:1rem;align-items:flex-start}
.grid::-webkit-scrollbar{height:3px}.grid::-webkit-scrollbar-thumb{background:var(--bds)}

/* CARD */
.card{min-width:300px;max-width:300px;flex-shrink:0;background:var(--sf);border:1px solid var(--bds);display:flex;flex-direction:column}
.ch{padding:1rem 1.1rem .9rem;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.ci{flex:1;min-width:0}
.pn{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--mu);margin-top:3px;font-weight:300;letter-spacing:.06em}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;padding:.4rem 1.1rem;border-bottom:1px solid var(--bd)}
.ctag{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--bds)}
.hb{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.ib{width:26px;height:26px;border:none;background:transparent;color:var(--mu);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:color .15s}
.ib:hover{color:var(--tx)}.ib.d:hover{color:var(--dg)}
.pg{height:2px;background:var(--bd)}.pgf{height:100%;transition:width .3s}

/* ITEMS */
.il{padding:.4rem 1.1rem;flex:1;max-height:320px;overflow-y:auto}
.ir{padding:6px 0;border-bottom:1px solid var(--bd)}
.ir:last-child{border-bottom:none}
.ir-main{display:flex;align-items:center;gap:8px}
.inum{font-size:10px;font-weight:700;color:var(--li);min-width:14px;text-align:right;flex-shrink:0}
.ck{width:16px;height:16px;border:1.5px solid var(--bds);background:var(--sf);cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ck.on{background:var(--ac);border-color:var(--ac)}
.ck svg{display:none}.ck.on svg{display:block}
.it{flex:1;font-size:12.5px;line-height:1.4;word-break:break-word}
.it.done{color:var(--li);text-decoration:line-through}
.due-badge{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;flex-shrink:0;text-transform:uppercase}
.due-ok{color:var(--mu);background:var(--bd)}
.due-soon{color:#e67e22;background:#fef3e2}
.due-overdue{color:var(--dg);background:var(--dgb)}
.item-actions{display:flex;gap:2px;flex-shrink:0}
.ia{width:18px;height:18px;border:none;background:transparent;color:var(--li);cursor:pointer;
  font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s}
.ir:hover .ia{opacity:1}.ia:hover{color:var(--tx)}.ia.d:hover{color:var(--dg)}

/* SUBTASKS */
.subitems{padding:.3rem 0 .3rem 2.5rem;display:none}
.subitems.open{display:block}
.subir{display:flex;align-items:center;gap:6px;padding:3px 0}
.subck{width:13px;height:13px;border:1.5px solid var(--bds);background:var(--sf);cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.subck.on{background:var(--mu);border-color:var(--mu)}
.subck svg{display:none}.subck.on svg{display:block}
.subtxt{flex:1;font-size:11.5px;color:var(--mu);line-height:1.4}
.subtxt.done{text-decoration:line-through;color:var(--li)}
.subdel{width:16px;height:16px;border:none;background:transparent;color:var(--li);cursor:pointer;font-size:10px;opacity:0;transition:opacity .15s}
.subir:hover .subdel{opacity:1}
.sub-add{display:flex;gap:4px;margin-top:4px}
.sub-add input{flex:1;height:26px;border:1px solid var(--bds);background:var(--bg);color:var(--tx);
  font-size:11px;padding:0 8px;outline:none;font-family:inherit}
.sub-add input:focus{border-color:var(--ac)}
.sub-add button{height:26px;width:26px;border:1px solid var(--ac);background:var(--ac);color:var(--sf);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* COMMENT */
.item-comment{font-size:11px;color:var(--mu);font-style:italic;padding:.3rem 0 .3rem 2.5rem;line-height:1.5;display:none}
.item-comment.show{display:block}

.ei{padding:1rem 0;text-align:center;font-size:11px;color:var(--li);letter-spacing:.1em;text-transform:uppercase}
.ft{padding:.7rem 1.1rem;border-top:1px solid var(--bd)}
.ar{display:flex}
.ar input[type="text"]{flex:1;height:32px;border:1px solid var(--bds);border-right:none;background:var(--bg);
  color:var(--tx);font-size:12px;padding:0 10px;outline:none;font-family:inherit}
.ar input[type="text"]:focus{border-color:var(--ac)}
.ar input[type="text"]::placeholder{color:var(--li);font-weight:300}
.ar input[type="date"]{width:130px;height:32px;border:1px solid var(--bds);border-right:none;
  background:var(--bg);color:var(--tx);font-size:11px;padding:0 6px;outline:none;font-family:inherit;flex-shrink:0}
.ar input[type="date"]:focus{border-color:var(--ac)}
.ab{width:32px;height:32px;border:1.5px solid var(--ac);background:var(--ac);color:var(--sf);
  cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ab:hover{background:var(--ach)}

/* TEAM */
.proj-type-badge{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--bds);color:var(--mu);margin-top:3px;display:inline-block}
.proj-type-badge.team{border-color:#378ADD;color:#378ADD}
.proj-type-badge.personal{border-color:var(--li);color:var(--li)}
.proj-members{font-size:10px;color:var(--mu);margin-top:2px;letter-spacing:.04em}
.member-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--ac);color:var(--sf);font-size:9px;font-weight:700;
  margin-right:2px;text-transform:uppercase;border:2px solid var(--sf)}
.member-add-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.member-add-row input{flex:1;min-width:0;height:34px;border:1px solid var(--bds);background:var(--bg);
  color:var(--tx);font-size:12px;padding:0 10px;outline:none;font-family:inherit}
.member-add-row input:focus{border-color:var(--ac)}
.member-add-row .btn{flex-shrink:0;white-space:nowrap}
.member-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.member-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;
  border-bottom:1px solid var(--bd)}
.member-row:last-child{border-bottom:none}
.member-email{flex:1;color:var(--mu);font-size:11px}
.member-role{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--li)}
.type-toggle{display:flex;gap:0;margin-bottom:0}
.type-opt{flex:1;padding:8px;border:1.5px solid var(--bds);background:transparent;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;color:var(--mu)}
.type-opt:first-child{border-right:none}
.type-opt.sel-personal{border-color:var(--ac);background:var(--ac);color:var(--sf)}
.type-opt.sel-team{border-color:#378ADD;background:#378ADD;color:#fff}
/* SEARCH & FILTERS */
.filter-bar{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.25rem}
.search-wrap{display:flex;align-items:center;border:1px solid var(--bds);background:var(--sf);height:40px;padding:0 12px;gap:8px;max-width:500px}
.search-wrap:focus-within{border-color:var(--ac)}
.search-icon{font-size:16px;color:var(--mu);flex-shrink:0}
#search-input{flex:1;border:none;background:transparent;color:var(--tx);font-size:13px;outline:none;font-family:inherit}
#search-input::placeholder{color:var(--li)}
#search-clear{border:none;background:transparent;color:var(--li);cursor:pointer;font-size:13px;padding:0;display:none}
#search-clear.show{display:block}
.filter-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fpill-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.fpill-sep{width:1px;height:16px;background:var(--bds);margin:0 4px}
.fpill{padding:4px 12px;border:1px solid var(--bds);background:transparent;color:var(--mu);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .15s}
.fpill:hover{border-color:var(--ac);color:var(--tx)}
.fpill.active{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.search-highlight{background:#fff3a3;border-radius:2px;padding:0 1px}
@media(prefers-color-scheme:dark){.search-highlight{background:#5a4a00}}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.cal-nav button{padding:6px 14px;border:1px solid var(--bds);background:transparent;color:var(--tx);
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .15s}
.cal-nav button:hover{background:var(--bg)}
.cal-month{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bds);border:1px solid var(--bds)}
.cal-dow{background:var(--bg);padding:8px 4px;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.cal-day{background:var(--sf);padding:8px;min-height:90px;vertical-align:top;position:relative}
.cal-day.other-month{background:var(--bg);opacity:.5}
.cal-day.today{outline:2px solid var(--ac);outline-offset:-2px}
.cal-day-num{font-size:11px;font-weight:700;color:var(--mu);margin-bottom:4px}
.cal-day.today .cal-day-num{color:var(--ac)}
.cal-task{font-size:10px;padding:2px 6px;margin-bottom:2px;border-left:2px solid var(--ac);
  background:var(--bg);color:var(--tx);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s}
.cal-task:hover{background:var(--bds)}
.cal-task.done{opacity:.5;text-decoration:line-through}
.cal-task.overdue{border-left-color:var(--dg);color:var(--dg)}
.cal-task.soon{border-left-color:#e67e22}
.cal-more{font-size:9px;color:var(--mu);font-weight:700;letter-spacing:.08em;padding:1px 6px;cursor:pointer}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.dash-card{background:var(--sf);border:1px solid var(--bds);padding:1.25rem}
.dash-card-label{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin-bottom:.5rem}
.dash-card-value{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1}
.dash-card-sub{font-size:11px;color:var(--mu);margin-top:4px;font-weight:300}
.dash-section{margin-bottom:2rem}
.dash-section-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mu);padding-bottom:.75rem;border-bottom:1px solid var(--bds);margin-bottom:1rem}
.dash-proj-row{display:flex;align-items:center;gap:12px;padding:.6rem 0;border-bottom:1px solid var(--bd)}
.dash-proj-row:last-child{border-bottom:none}
.dash-proj-name{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-bar-wrap{width:120px;height:6px;background:var(--bd);flex-shrink:0}
.dash-bar-fill{height:100%;transition:width .4s ease}
.dash-pct{font-size:11px;font-weight:700;color:var(--mu);min-width:32px;text-align:right;flex-shrink:0}
.dash-upcoming{display:flex;flex-direction:column;gap:.4rem}
.dash-upcoming-item{display:flex;align-items:center;gap:10px;padding:.5rem .75rem;
  background:var(--sf);border:1px solid var(--bd)}
.dash-upcoming-date{font-size:10px;font-weight:700;letter-spacing:.06em;min-width:50px;flex-shrink:0}
.dash-upcoming-text{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-upcoming-proj{font-size:10px;color:var(--mu);flex-shrink:0}
.dash-pie-wrap{display:flex;align-items:center;gap:2.5rem;flex-wrap:wrap;padding:.5rem 0}
.dash-legend{display:flex;flex-direction:column;gap:.5rem}
.dash-legend-row{display:flex;align-items:center;gap:8px}
.dash-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dash-legend-name{font-size:12px;font-weight:500;flex:1}
.dash-legend-count{font-size:11px;color:var(--mu);font-weight:300;min-width:60px;text-align:right}
.overdue-badge{color:var(--dg)}.soon-badge{color:#e67e22}
/* HISTORIAL */
.hday{margin-bottom:2rem}
.hdtitle{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);
  padding-bottom:.6rem;border-bottom:1px solid var(--bds);margin-bottom:.5rem}
.hitem{display:flex;align-items:center;gap:12px;padding:.8rem 1rem;background:var(--sf);
  border:1px solid var(--bd);border-bottom:none;cursor:pointer;transition:background .15s}
.hitem:last-child{border-bottom:1px solid var(--bd)}
.hitem:hover{background:var(--bg)}
.hnum{font-size:11px;font-weight:700;color:var(--li);min-width:20px;text-align:right;flex-shrink:0}
.htime{font-size:13px;font-weight:500;flex:1}
.hmeta{font-size:11px;color:var(--mu);font-weight:300;margin-top:2px}
.harrow{color:var(--mu);font-size:14px}

/* SNAP MODAL */
.snov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
  align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.snov.open{display:flex}
.snmo{background:var(--sf);border:1px solid var(--bds);width:100%;max-width:680px;margin:auto}
.snhd{padding:1.25rem 1.5rem;border-bottom:1px solid var(--bds);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--sf)}
.snhd h2{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.sncl{border:none;background:transparent;color:var(--mu);font-size:20px;cursor:pointer;line-height:1}
.snbd{padding:1.25rem;display:flex;flex-direction:column;gap:.75rem}
.snpr{border:1px solid var(--bds)}
.snph{padding:.6rem 1rem;border-bottom:1px solid var(--bd);background:var(--bg);display:flex;align-items:center;gap:8px}
.snpn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.snil{padding:.25rem 1rem}
.snir{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px}
.snir:last-child{border-bottom:none}
.snnum{font-size:10px;color:var(--li);min-width:16px;text-align:right;flex-shrink:0}
.snck{width:13px;height:13px;border:1.5px solid var(--bds);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.snck.on{background:var(--ac);border-color:var(--ac)}
.sntx{flex:1}.sntx.done{color:var(--li);text-decoration:line-through}

/* ITEM / PROJECT MODALS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:1rem}
.ov.open{display:flex}
.mo{background:var(--sf);border:1px solid var(--bds);width:100%;max-width:440px;padding:2rem;max-height:90vh;overflow-y:auto}
.mo h2{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--bds)}
.sw-wrap{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.sw:hover{transform:scale(1.15)}.sw.a{border-color:var(--tx)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--bd)}

/* TAGS MODAL */
.tags-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag-sel{padding:4px 10px;border:1px solid var(--bds);font-size:9px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--mu);font-family:inherit;transition:all .15s}
.tag-sel.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.tag-add-row{display:flex;gap:6px;margin-top:6px}
.tag-add-row input{flex:1;height:30px;border:1px solid var(--bds);background:var(--bg);color:var(--tx);
  font-size:12px;padding:0 10px;outline:none;font-family:inherit}
.tag-add-row input:focus{border-color:var(--ac)}

.empty{text-align:center;padding:4rem 1rem;color:var(--mu);min-width:300px}
.empty h2{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:.5rem}
.empty p{font-size:12px;font-weight:300;letter-spacing:.06em}
.offline-badge{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--dg);padding:4px 10px;}
.notif-btn{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 12px;border:1px solid var(--bds);background:transparent;color:var(--mu);
  cursor:pointer;font-family:inherit;transition:all .15s}
.notif-btn:hover{background:var(--bg)}
.notif-btn.on{border-color:#1a8a5a;color:#1a8a5a}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--ac);color:var(--sf);padding:10px 16px;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;z-index:300;
  opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>

<script>
const SB = 'https://zowoxslntbvsituaakwu.supabase.co';
const KEY = 'sb_publishable_CA_4o91nGqlZgHnjk5-Xhg_YlEIIsFq';
const H = tok => ({'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+(tok||KEY),'Prefer':'return=representation'});
const COLORS = ['#0d0d0d','#1D9E75','#D85A30','#D4537E','#378ADD','#639922','#BA7517','#E24B4A','#888780','#0F6E56'];
const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let ps=[], tags=[], currentUser=null, accessToken=null, saveTimer=null;
let editProjId=null, editItemId=null, editItemProjId=null, selColor=COLORS[0], selType_='personal', pendingMembers=[];
let activeTag=null, searchQuery='', statusFilter='all';

// CLOCK
function tick(){
  const n=new Date(), p=v=>String(v).padStart(2,'0');
  document.getElementById('clk').textContent=DAYS[n.getDay()]+' '+n.getDate()+' de '+MONTHS[n.getMonth()]+' '+n.getFullYear()+' — '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}
tick(); setInterval(tick,1000);

// AUTH
let authMode='login';
function authTab(m){
  authMode=m;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&m==='login')||(i===1&&m==='register')));
  document.getElementById('auth-btn').textContent=m==='login'?'Entrar':'Crear cuenta';
  document.getElementById('auth-err').classList.remove('show');
}
async function authSubmit(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('auth-btn');
  if(!email||!pass){showAuthErr('Completa todos los campos');return;}
  btn.disabled=true; btn.textContent='Cargando...';
  const ep=authMode==='login'?'/auth/v1/token?grant_type=password':'/auth/v1/signup';
  try{
    const r=await fetch(SB+ep,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!r.ok){showAuthErr(d.error_description||d.msg||'Error');btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Crear cuenta';return;}
    accessToken=d.access_token; currentUser=d.user;
    localStorage.setItem('jv_tok',accessToken);
    localStorage.setItem('jv_usr',JSON.stringify(currentUser));
    if(d.refresh_token) localStorage.setItem('jv_ref_tok',d.refresh_token);
    startApp();
  }catch(e){showAuthErr('Sin conexión');btn.disabled=false;btn.textContent='Entrar';}
}
function showAuthErr(m){const e=document.getElementById('auth-err');e.textContent=m;e.classList.add('show');}
async function logout(){
  try{await fetch(SB+'/auth/v1/logout',{method:'POST',headers:H(accessToken)});}catch(e){}
  localStorage.removeItem('jv_tok'); localStorage.removeItem('jv_usr'); localStorage.removeItem('jv_ref_tok');
  accessToken=null; currentUser=null; ps=[]; tags=[];
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}
async function tryAutoLogin(){
  const tok=localStorage.getItem('jv_tok');
  const refTok=localStorage.getItem('jv_ref_tok');
  const usr=localStorage.getItem('jv_usr');
  if(!usr) return false;
  // Try current token first
  if(tok){
    try{
      const r=await fetch(SB+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+tok}});
      if(r.ok){ accessToken=tok; currentUser=JSON.parse(usr); return true; }
    }catch(e){}
  }
  // Try refresh token
  if(refTok){
    try{
      const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':KEY},
        body:JSON.stringify({refresh_token:refTok})
      });
      if(r.ok){
        const d=await r.json();
        accessToken=d.access_token;
        currentUser=d.user;
        localStorage.setItem('jv_tok',accessToken);
        localStorage.setItem('jv_usr',JSON.stringify(currentUser));
        if(d.refresh_token) localStorage.setItem('jv_ref_tok',d.refresh_token);
        return true;
      }
    }catch(e){}
  }
  return false;
}
async function startApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-em').textContent=currentUser.email;
  await Promise.all([loadTags(), loadProjects()]);
  await checkDailyReset();
  updateOnlineStatus();
  updateNotifBtn();
  if(notifEnabled) checkDueNotifications();
}

async function checkDailyReset(){
  const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  const lastReset = localStorage.getItem('jv_last_reset_'+currentUser.id);
  if(lastReset === today) return; // already reset today

  // Find pending (not done) items from all projects (excluding "Tareas pendientes" itself)
  const pendingItems = [];
  ps.forEach(p => {
    if(p.name === 'Tareas pendientes') return;
    p.items.forEach(it => {
      if(!it.done) pendingItems.push({...it, fromProj: p.name, fromProjId: p.id});
    });
  });

  if(pendingItems.length === 0){
    localStorage.setItem('jv_last_reset_'+currentUser.id, today);
    return;
  }

  // Get or create "Tareas pendientes" project
  let pendProj = ps.find(p => p.name === 'Tareas pendientes');
  if(!pendProj){
    const newId = crypto.randomUUID();
    await fetch(SB+'/rest/v1/projects',{method:'POST',headers:H(accessToken),
      body:JSON.stringify({id:newId,name:'Tareas pendientes',color:'#E24B4A',user_id:currentUser.id})});
    pendProj = {id:newId, name:'Tareas pendientes', color:'#E24B4A', items:[], tagIds:[]};
    ps.push(pendProj);
  }

  // Format yesterday label
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const dayLabel = DAYS[yesterday.getDay()]+' '+yesterday.getDate()+' de '+MONTHS[yesterday.getMonth()]+' '+yesterday.getFullYear();
  const comment = 'Pendiente del '+dayLabel;

  // Move pending items to "Tareas pendientes"
  for(const it of pendingItems){
    const newId = crypto.randomUUID();
    // Create in pending project
    await fetch(SB+'/rest/v1/items',{method:'POST',headers:H(accessToken),
      body:JSON.stringify({id:newId,project_id:pendProj.id,user_id:currentUser.id,
        text:it.text,done:false,position:pendProj.items.length,comment})});
    // Delete from original project
    await fetch(SB+'/rest/v1/items?id=eq.'+it.id,{method:'DELETE',headers:H(accessToken)});
  }

  localStorage.setItem('jv_last_reset_'+currentUser.id, today);
  await loadProjects();
  toast('Se movieron '+pendingItems.length+' tarea'+(pendingItems.length>1?'s':'')+' pendientes al proyecto "Tareas pendientes"');
}

// DATA
async function loadTags(){
  const r=await fetch(SB+'/rest/v1/tags?order=name.asc',{headers:H(accessToken)});
  tags=await r.json(); if(!Array.isArray(tags)) tags=[];
  renderTagBar();
}
async function loadProjects(){
  document.getElementById('sum').textContent='Cargando...';
  try{
    // Load everything in 4 parallel requests
    const [rProj, rItems, rSubs, rPTags] = await Promise.all([
      fetch(SB+'/rest/v1/projects?select=id,name,color,created_at,type,owner_id,user_id&order=created_at.asc',{headers:H(accessToken)}),
      fetch(SB+'/rest/v1/items?select=id,project_id,text,done,position,due_date,comment,created_at&order=position.asc,created_at.asc',{headers:H(accessToken)}),
      fetch(SB+'/rest/v1/subitems?select=id,item_id,text,done,position&order=position.asc',{headers:H(accessToken)}),
      fetch(SB+'/rest/v1/project_tags?select=project_id,tag_id',{headers:H(accessToken)})
    ]);
    if(rProj.status===401){
      const ok=await tryAutoLogin();
      if(ok){ await loadProjects(); return; }
      logout(); return;
    }
    if(!rProj.ok){ document.getElementById('sum').textContent='Error ('+rProj.status+')'; return; }
    const projs  = await rProj.json();
    const items  = rItems.ok  ? await rItems.json()  : [];
    const subs   = rSubs.ok   ? await rSubs.json()   : [];
    const ptags  = rPTags.ok  ? await rPTags.json()  : [];
    ps = (Array.isArray(projs)?projs:[]).map(p => {
      const projItems = (Array.isArray(items)?items:[])
        .filter(it=>it.project_id===p.id)
        .map(it=>({
          ...it,
          subitems:(Array.isArray(subs)?subs:[]).filter(s=>s.item_id===it.id)
        }));
      const tagIds = (Array.isArray(ptags)?ptags:[])
        .filter(pt=>pt.project_id===p.id)
        .map(pt=>pt.tag_id);
      return {...p, items:projItems, tagIds};
    });
    render();
  } catch(e){
    document.getElementById('sum').textContent='Error: '+e.message;
    console.error('loadProjects error:',e);
  }
}

function highlight(text, query){
  if(!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query);
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx))+'<mark class="search-highlight">'+esc(text.slice(idx,idx+query.length))+'</mark>'+esc(text.slice(idx+query.length));
}

// RENDER
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dueClass(d){
  if(!d) return '';
  const now=new Date(), due=new Date(d), diff=(due-now)/(1000*60*60*24);
  if(diff<0) return 'due-overdue'; if(diff<=3) return 'due-soon'; return 'due-ok';
}
function dueFmt(d){
  if(!d) return '';
  const dt=new Date(d+'T12:00:00');
  return dt.getDate()+' '+MONTHS[dt.getMonth()];
}
function render(){
  // Apply tag filter
  let filtered = activeTag ? ps.filter(p=>p.tagIds&&p.tagIds.includes(activeTag)) : [...ps];

  // Apply search & prio & status filters
  if(searchQuery || statusFilter!=='all'){
    filtered = filtered.map(p=>{
      // Check if project name matches
      const projMatch = !searchQuery || p.name.toLowerCase().includes(searchQuery);
      // Filter items
      let items = p.items.filter(it=>{
        const textMatch = !searchQuery || it.text.toLowerCase().includes(searchQuery) ||
          (it.comment&&it.comment.toLowerCase().includes(searchQuery)) ||
          (it.subitems&&it.subitems.some(s=>s.text.toLowerCase().includes(searchQuery)));
        const statusMatch = statusFilter==='all' || (statusFilter==='done'?it.done:!it.done);
        return (projMatch||textMatch) && statusMatch;
      });
      if(!projMatch && !items.length) return null;
      return {...p, items, _projMatch: projMatch};
    }).filter(Boolean);
  }
  const tot=filtered.reduce((a,p)=>a+p.items.length,0);
  const dn=filtered.reduce((a,p)=>a+p.items.filter(i=>i.done).length,0);
  document.getElementById('sum').textContent=!filtered.length?'Sin proyectos':filtered.length+' proyecto'+(filtered.length>1?'s':'')+' · '+dn+'/'+tot+' tareas';
  const g=document.getElementById('grid'); g.innerHTML='';
  if(!filtered.length){g.innerHTML='<div class="empty"><h2>Sin proyectos</h2><p>Crea tu primer proyecto.</p></div>';return;}
  filtered.forEach(p=>{
    const t=p.items.length, d=p.items.filter(i=>i.done).length, pct=t?Math.round(d/t*100):0;
    const card=document.createElement('div'); card.className='card';
    const ptags=(p.tagIds||[]).map(tid=>tags.find(t=>t.id===tid)).filter(Boolean);
    const tagsHtml=ptags.length?'<div class="card-tags">'+ptags.map(t=>'<span class="ctag" style="border-color:'+t.color+';color:'+t.color+'">'+esc(t.name)+'</span>').join('')+'</div>':'';
    const rowsHtml=t===0?'<div class="ei">Sin tareas aún</div>':p.items.map((it,idx)=>{
      const dc=dueClass(it.due_date), df=dueFmt(it.due_date);
      const hasSubs=it.subitems&&it.subitems.length>0;
      const subsDone=hasSubs?it.subitems.filter(s=>s.done).length:0;
      const subsHtml=hasSubs?it.subitems.map(s=>
        '<div class="subir">'+
        '<div class="subck'+(s.done?' on':'')+'" data-pid="'+p.id+'" data-iid="'+it.id+'" data-sid="'+s.id+'">'+
        '<svg width="7" height="5" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3 6L8 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '</div><span class="subtxt'+(s.done?' done':'')+'">'+esc(s.text)+'</span>'+
        '<button class="subdel" data-pid="'+p.id+'" data-iid="'+it.id+'" data-sid="'+s.id+'">✕</button></div>'
      ).join(''):'';
      const subAddHtml='<div class="sub-add"><input type="text" placeholder="+ subtarea..." class="sub-inp" data-pid="'+p.id+'" data-iid="'+it.id+'"><button class="sub-btn" data-pid="'+p.id+'" data-iid="'+it.id+'">+</button></div>';
      const commentHtml=it.comment?'<div class="item-comment show">'+esc(it.comment)+'</div>':'';
      return '<div class="ir">'+
        '<div class="ir-main">'+
        '<span class="inum">'+(idx+1)+'</span>'+
        '<div class="ck'+(it.done?' on':'')+'" data-pid="'+p.id+'" data-iid="'+it.id+'">'+
        '<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3 6L8 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '</div>'+

        '<span class="it'+(it.done?' done':'')+'">'+esc(it.text)+
        (hasSubs?' <small style="color:var(--mu);font-size:10px">('+subsDone+'/'+it.subitems.length+')</small>':'')+
        '</span>'+
        (df?'<span class="due-badge '+dc+'">'+df+'</span>':'')+
        '<div class="item-actions">'+
        '<button class="ia" data-edit-item="'+it.id+'" data-pid="'+p.id+'" title="Editar">✎</button>'+
        '<button class="ia" data-toggle-sub="'+it.id+'" title="Subtareas">↓</button>'+
        '<button class="ia d" data-del-item="'+it.id+'" data-pid="'+p.id+'" title="Eliminar">✕</button>'+
        '</div></div>'+
        commentHtml+
        '<div class="subitems" id="sub-'+it.id+'">'+subsHtml+subAddHtml+'</div>'+
        '</div>';
    }).join('');
    card.innerHTML=
      '<div class="ch"><div class="dot" style="background:'+p.color+'"></div>'+
      '<div class="ci"><div class="pn">'+esc(p.name)+'</div><div class="pm">'+d+'/'+t+(t?' · '+pct+'%':'')+'</div></div>'+
      '<div class="hb"><button class="ib" data-edit-proj="'+p.id+'" title="Editar">✎</button>'+
      '<button class="ib d" data-del-proj="'+p.id+'" title="Eliminar">🗑</button></div></div>'+

  });
  // events
  g.querySelectorAll('.ck').forEach(el=>el.onclick=()=>toggleItem(el.dataset.pid,el.dataset.iid));

  g.querySelectorAll('[data-del-proj]').forEach(el=>el.onclick=()=>delProject(el.dataset.delProj));

  g.querySelectorAll('.nd').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')addItemQuick(el.dataset.pid)}));
  g.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=()=>openItemModal(el.dataset.pid,el.dataset.editItem));
  g.querySelectorAll('[data-del-item]').forEach(el=>el.onclick=()=>delItem(el.dataset.pid,el.dataset.delItem));
  g.querySelectorAll('[data-toggle-sub]').forEach(el=>el.onclick=()=>{
    const s=document.getElementById('sub-'+el.dataset.toggleSub);

async function saveProjModal(){
  const n=document.getElementById('pname').value.trim();
  if(!n){toast('Escribe un nombre');return;}
  const selTagIds=[...document.querySelectorAll('#proj-tags-sel .tag-sel.on')].map(el=>el.dataset.tid);
  if(editProjId){
    await fetch(SB+'/rest/v1/projects?id=eq.'+editProjId,{method:'PATCH',headers:H(accessToken),
      body:JSON.stringify({name:n,color:selColor,type:selType_})});
    await fetch(SB+'/rest/v1/project_tags?project_id=eq.'+editProjId,{method:'DELETE',headers:H(accessToken)});
    for(const tid of selTagIds) await fetch(SB+'/rest/v1/project_tags',{method:'POST',headers:H(accessToken),body:JSON.stringify({project_id:editProjId,tag_id:tid})});
    // Add new pending members
    for(const email of pendingMembers){
      // Look up user by email via auth admin — use a workaround via snapshots table
      // We store pending invites in localStorage for now and match on login
      const inv = JSON.parse(localStorage.getItem('jv_invites')||'[]');
      inv.push({project_id:editProjId,email,invited_by:currentUser.email});
      localStorage.setItem('jv_invites',JSON.stringify(inv));
    }
    toast('Proyecto actualizado');
  } else {
    const newId=crypto.randomUUID();
    const r=await fetch(SB+'/rest/v1/projects',{method:'POST',headers:H(accessToken),
      body:JSON.stringify({id:newId,name:n,color:selColor,user_id:currentUser.id,owner_id:currentUser.id,type:selType_})});
    if(!r.ok){
      const err=await r.json();
      toast('Error: '+(err.message||err.hint||r.status));
      console.error('Project create error:',err);
      return;
    }
    for(const tid of selTagIds) await fetch(SB+'/rest/v1/project_tags',{method:'POST',headers:H(accessToken),body:JSON.stringify({project_id:newId,tag_id:tid})});
    // Add members for team projects
    if(selType_==='team'){
      // Add owner as member
      await fetch(SB+'/rest/v1/project_members',{method:'POST',headers:H(accessToken),
        body:JSON.stringify({project_id:newId,user_id:currentUser.id,role:'owner'})});
      // Add pending members by resolving emails
      for(const email of pendingMembers){
        await addMemberByEmail(newId, email);
      }
    }
    toast('Proyecto de '+(selType_==='team'?'equipo':'uso personal')+' creado');
  }
  closeMo('pov'); await loadProjects();
}

async function addMemberByEmail(projectId, email){
  // Find user by email using Supabase auth admin endpoint (needs service role)
  // Workaround: store invite, resolved when that user logs in
  try{
    // Try direct lookup via a custom RPC or just store invite
    const inv = JSON.parse(localStorage.getItem('jv_invites_sent')||'[]');
    inv.push({project_id:projectId, email:email.toLowerCase(), invited_by:currentUser.id, created_at:new Date().toISOString()});
    localStorage.setItem('jv_invites_sent', JSON.stringify(inv));
    // Also insert into project_members using email match from auth.users
    // This works if we use a Supabase function — for now store invite
    const r = await fetch(SB+'/rest/v1/rpc/add_member_by_email',{
      method:'POST', headers:H(accessToken),
      body:JSON.stringify({p_project_id:projectId, p_email:email.toLowerCase()})
    });
    if(r.ok) console.log('Member added:', email);
    else console.warn('Could not add member directly, invite stored');
  } catch(e){ console.warn('addMemberByEmail error:', e); }
}
async function delProject(id){
  if(!confirm('¿Eliminar este proyecto y todas sus tareas?')) return;
  await fetch(SB+'/rest/v1/projects?id=eq.'+id,{method:'DELETE',headers:H(accessToken)});
  toast('Eliminado'); await loadProjects();
}

// HISTORIAL
async function loadHistory(){
  const list=document.getElementById('hlist');
  list.innerHTML='<div class="empty"><p>Cargando...</p></div>';
  try{
    const r=await fetch(SB+'/rest/v1/snapshots?select=id,label,saved_at&order=saved_at.desc',{headers:H(accessToken)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length){
      list.innerHTML='<div class="empty"><h2>Sin historial aún</h2><p>Los cambios se guardan automáticamente.</p></div>';
      document.getElementById('hsub').textContent='0 guardados'; return;
    }
    const byDay={};
    rows.forEach(row=>{
      const dt=new Date(row.saved_at);
      const key=DAYS[dt.getDay()]+', '+dt.getDate()+' de '+MONTHS[dt.getMonth()]+' de '+dt.getFullYear();
      if(!byDay[key]) byDay[key]=[];
      byDay[key].push({...row,dt});
    });
    const nd=Object.keys(byDay).length;
    document.getElementById('hsub').textContent=rows.length+' guardado'+(rows.length>1?'s':'')+' en '+nd+' día'+(nd>1?'s':'');
    list.innerHTML=Object.entries(byDay).map(([day,items])=>{
      const ih=items.map((item,i)=>{
        const p=v=>String(v).padStart(2,'0');
        const t=p(item.dt.getHours())+':'+p(item.dt.getMinutes());
        return '<div class="hitem" data-id="'+item.id+'" data-label="'+esc(item.label||t)+'">'+
          '<span class="hnum">'+(items.length-i)+'</span>'+
          '<div style="flex:1"><div class="htime">Guardado a las '+t+'</div>'+
          '<div class="hmeta">'+esc(item.label||item.id)+'</div></div>'+
          '<span class="harrow">→</span></div>';
      }).join('');
      return '<div class="hday"><div class="hdtitle">'+esc(day)+'</div>'+ih+'</div>';
    }).join('');
    document.querySelectorAll('.hitem').forEach(el=>el.addEventListener('click',()=>openSnap(el.dataset.id,el.dataset.label)));
  }catch(e){list.innerHTML='<div class="empty"><h2>Error</h2><p>'+esc(e.message)+'</p></div>';}
}

// ── CALENDAR ─────────────────────────────────────────
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
function renderCalendar(){
  const container = document.getElementById('cal-container');
  const today = new Date(); today.setHours(0,0,0,0);
  // Collect all items with due dates
  const allItems = [];
  ps.forEach(p => p.items.forEach(it => {
    if(it.due_date) allItems.push({...it, projName: p.name, projColor: p.color});
  }));
  // Build calendar
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const totalCells = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;
  const monthName = MONTHS[calMonth].charAt(0).toUpperCase() + MONTHS[calMonth].slice(1);
  let html2 = '<div class="cal-nav">' +
    '<button onclick="calPrev()">← Anterior</button>' +
    '<span class="cal-month">' + monthName + ' ' + calYear + '</span>' +
    '<button onclick="calNext()">Siguiente →</button>' +
    '</div>' +
    '<div class="cal-grid">';
  ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(d => html2 += '<div class="cal-dow">'+d+'</div>');
  for(let i=0; i<totalCells; i++){
    const dayNum = i - startDow + 1;
    const isValid = dayNum >= 1 && dayNum <= lastDay.getDate();
    const thisDate = isValid ? new Date(calYear, calMonth, dayNum) : null;
    const isToday = thisDate && thisDate.getTime() === today.getTime();
    const dayTasks = isValid ? allItems.filter(it => {
      const d = new Date(it.due_date+'T12:00:00');
      return d.getFullYear()===calYear && d.getMonth()===calMonth && d.getDate()===dayNum;
    }) : [];
    html2 += '<div class="cal-day'+(isValid?'':' other-month')+(isToday?' today':'')+'">';
    if(isValid){
      html2 += '<div class="cal-day-num">'+dayNum+'</div>';
      const show = dayTasks.slice(0,3);
      show.forEach(it => {
        const diff = thisDate ? (thisDate - today)/(1000*60*60*24) : 0;
        const cls = it.done ? 'done' : (diff < 0 ? 'overdue' : diff <= 3 ? 'soon' : '');
        html2 += '<div class="cal-task '+cls+'" style="border-left-color:'+it.projColor+'" title="'+esc(it.projName)+': '+esc(it.text)+'">'+esc(it.text)+'</div>';
      });
      if(dayTasks.length > 3) html2 += '<div class="cal-more">+' + (dayTasks.length-3) + ' más</div>';
    }
    html2 += '</div>';
  }
  html2 += '</div>';
  container.innerHTML = html2;
}
function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

// ── DASHBOARD ─────────────────────────────────────────
function renderDashboard(){
  const container = document.getElementById('dash-container');
  const today = new Date(); today.setHours(0,0,0,0);

  // All unresolved (pending) items across all projects
  const allItems = [];
  ps.forEach(p => p.items.forEach(it => allItems.push({...it, projName:p.name, projColor:p.color})));
  const totalPending = allItems.filter(i=>!i.done).length;
  const totalDone = allItems.filter(i=>i.done).length;
  const total = allItems.length;

  // Overdue & upcoming
  const withDate = allItems.filter(i=>i.due_date && !i.done);
  const overdue = withDate.filter(i=>new Date(i.due_date+'T12:00:00')<today);
  const upcoming = withDate.filter(i=>new Date(i.due_date+'T12:00:00')>=today)
    .sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)).slice(0,8);

  // KPI row
  let h = '<div class="dash-grid">' +
    kpi('Sin resolver', totalPending, 'tareas pendientes', totalPending>0?'var(--dg)':'') +
    kpi('Completadas', totalDone, total ? Math.round(totalDone/total*100)+'% del total' : '') +
    kpi('Con fecha vencida', overdue.length, 'requieren atención', overdue.length>0?'var(--dg)':'') +
    kpi('Proyectos activos', ps.length, total+' tareas en total') +
    '</div>';

  // PIE CHART — pending tasks by project
  h += '<div class="dash-section"><div class="dash-section-title">Tareas sin resolver por proyecto</div>';
  const projPending = ps.map(p=>({name:p.name,color:p.color,count:p.items.filter(i=>!i.done).length})).filter(p=>p.count>0);
  if(!projPending.length){
    h += '<p style="font-size:13px;color:var(--mu);font-weight:300">🎉 No hay tareas pendientes.</p>';
  } else {
    const totalSlices = projPending.reduce((a,p)=>a+p.count,0);
    // Build SVG pie
    const cx=120,cy=120,r=100;
    let angle=-Math.PI/2, svgSlices='', legend='';
    projPending.forEach((p,i)=>{
      const sliceAngle = (p.count/totalSlices)*2*Math.PI;
      const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(angle+sliceAngle), y2=cy+r*Math.sin(angle+sliceAngle);
      const large=sliceAngle>Math.PI?1:0;
      if(projPending.length===1){
        svgSlices+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+p.color+'"/>';
      } else {
        svgSlices+='<path d="M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+
          ' A'+r+','+r+' 0 '+large+',1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z" fill="'+p.color+'" opacity="0.9"/>';
      }
      const pct2=Math.round(p.count/totalSlices*100);
      legend+='<div class="dash-legend-row"><div class="dash-legend-dot" style="background:'+p.color+'"></div>'+
        '<span class="dash-legend-name">'+esc(p.name)+'</span>'+
        '<span class="dash-legend-count">'+p.count+' ('+pct2+'%)</span></div>';
      angle+=sliceAngle;
    });
    // Center donut hole
    svgSlices+='<circle cx="'+cx+'" cy="'+cy+'" r="55" fill="var(--sf)"/>';
    svgSlices+='<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="28" font-weight="700" fill="var(--tx)">'+totalPending+'</text>';
    svgSlices+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--mu)" letter-spacing="2">PENDIENTES</text>';
    h += '<div class="dash-pie-wrap">'+
      '<svg width="240" height="240" viewBox="0 0 240 240">'+svgSlices+'</svg>'+
      '<div class="dash-legend">'+legend+'</div>'+
      '</div>';
  }
  h += '</div>';

  // Progress per project
  h += '<div class="dash-section"><div class="dash-section-title">Progreso por proyecto</div>';
  if(!ps.length){ h += '<p style="font-size:12px;color:var(--mu)">Sin proyectos aún.</p>'; }
  else {
    ps.forEach(p => {
      const t=p.items.length, d=p.items.filter(i=>i.done).length, pct2=t?Math.round(d/t*100):0;
      h += '<div class="dash-proj-row">' +
        '<div class="dot" style="background:'+p.color+';margin-top:0;flex-shrink:0"></div>' +
        '<span class="dash-proj-name">'+esc(p.name)+'</span>' +
        '<div class="dash-bar-wrap"><div class="dash-bar-fill" style="width:'+pct2+'%;background:'+p.color+'"></div></div>' +
        '<span class="dash-pct">'+pct2+'%</span>' +
        '</div>';
    });
  }
  h += '</div>';

  // Upcoming deadlines
  h += '<div class="dash-section"><div class="dash-section-title">Próximas fechas límite</div>';
  if(!upcoming.length){ h += '<p style="font-size:12px;color:var(--mu);font-weight:300">Sin tareas con fecha próxima.</p>'; }
  else {
    h += '<div class="dash-upcoming">';
    upcoming.forEach(it => {
      const d=new Date(it.due_date+'T12:00:00');
      const diff=Math.round((d-today)/(1000*60*60*24));
      const dateStr=d.getDate()+' '+MONTHS[d.getMonth()];
      const cls=diff===0?'soon-badge':'';
      const label=diff===0?'Hoy':diff===1?'Mañana':'En '+diff+' días';
      h += '<div class="dash-upcoming-item">'+
        '<span class="dash-upcoming-date '+cls+'">'+dateStr+'</span>'+
        '<span class="dash-upcoming-text">'+esc(it.text)+'</span>'+
        '<span class="dash-upcoming-proj" style="color:'+it.projColor+'">'+esc(it.projName)+'</span>'+
        '<span class="'+cls+'" style="font-size:10px;font-weight:700;flex-shrink:0;min-width:60px;text-align:right">'+label+'</span>'+
        '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Overdue
  if(overdue.length){
    h += '<div class="dash-section"><div class="dash-section-title" style="color:var(--dg)">Tareas vencidas</div><div class="dash-upcoming">';
    overdue.forEach(it => {
      const d=new Date(it.due_date+'T12:00:00');
      const diff=Math.round((today-d)/(1000*60*60*24));
      h += '<div class="dash-upcoming-item">'+
        '<span class="dash-upcoming-date overdue-badge">'+d.getDate()+' '+MONTHS[d.getMonth()]+'</span>'+
        '<span class="dash-upcoming-text">'+esc(it.text)+'</span>'+
        '<span class="dash-upcoming-proj" style="color:'+it.projColor+'">'+esc(it.projName)+'</span>'+
        '<span class="overdue-badge" style="font-size:10px;font-weight:700;flex-shrink:0;min-width:60px;text-align:right">Hace '+diff+'d</span>'+
        '</div>';
    });
    h += '</div></div>';
  }

  container.innerHTML = h;
}

    '<div class="dash-card-label">'+label+'</div>'+
    '<div class="dash-card-value" style="'+(color?'color:'+color:'')+'">'+(value||0)+'</div>'+
    (sub?'<div class="dash-card-sub">'+sub+'</div>':'')+

// ── OFFLINE MODE ─────────────────────────────────────
let isOnline = navigator.onLine;
let offlineQueue = JSON.parse(localStorage.getItem('jv_offline_queue') || '[]');

function updateOnlineStatus(){
  isOnline = navigator.onLine;
  const badge = document.getElementById('offline-badge');
  if(badge) badge.style.display = isOnline ? 'none' : 'block';
  if(isOnline && offlineQueue.length > 0){
    toast('Conexión restaurada — sincronizando '+offlineQueue.length+' cambio'+(offlineQueue.length>1?'s':'')+'...');
    flushOfflineQueue();
  }
}
window.addEventListener('online',  updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

async function flushOfflineQueue(){
  const queue = [...offlineQueue];
  offlineQueue = [];
  localStorage.setItem('jv_offline_queue','[]');
  for(const op of queue){
    try{
      await fetch(op.url, {method:op.method, headers:H(accessToken), body:op.body||undefined});
    } catch(e){ console.warn('Flush failed for op:', op); }
  }
  await loadProjects();
  toast('Sincronizado con Supabase');
}

function queueOrFetch(url, method, body){
  if(isOnline){
    return fetch(url, {method, headers:H(accessToken), body: body ? JSON.stringify(body) : undefined});
  } else {
    offlineQueue.push({url, method, body: body ? JSON.stringify(body) : undefined});
    localStorage.setItem('jv_offline_queue', JSON.stringify(offlineQueue));
    return Promise.resolve({ok:true, json:()=>Promise.resolve({})});
  }
}

// ── NOTIFICATIONS ─────────────────────────────────────
let notifEnabled = localStorage.getItem('jv_notif') === 'true';

function updateNotifBtn(){
  const btn = document.getElementById('notif-btn');
  if(!btn) return;
  if(!('Notification' in window)){btn.style.display='none';return;}
  if(Notification.permission==='granted' && notifEnabled){
    btn.textContent='🔔 Activas'; btn.classList.add('on');
  } else {
    btn.textContent='🔔 Notificaciones'; btn.classList.remove('on');
  }
}

async function requestNotifPermission(){
  if(!('Notification' in window)){ toast('Tu navegador no soporta notificaciones'); return; }
  if(Notification.permission === 'granted'){
    notifEnabled = !notifEnabled;
    localStorage.setItem('jv_notif', notifEnabled);
    updateNotifBtn();
    toast(notifEnabled ? 'Notificaciones activadas' : 'Notificaciones desactivadas');
    if(notifEnabled) checkDueNotifications();
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    notifEnabled = true;
    localStorage.setItem('jv_notif','true');
    updateNotifBtn();
    toast('Notificaciones activadas');
    checkDueNotifications();
  } else {
    toast('Permiso denegado para notificaciones');
  }
}

function checkDueNotifications(){
  if(!notifEnabled || Notification.permission !== 'granted') return;
  const today = new Date(); today.setHours(0,0,0,0);
  const allItems = [];
  ps.forEach(p => p.items.forEach(it => allItems.push({...it, projName:p.name})));
  const dueToday = allItems.filter(it => {
    if(!it.due_date || it.done) return false;
    const d = new Date(it.due_date+'T12:00:00'); d.setHours(0,0,0,0);
    return d.getTime() === today.getTime();
  });
  const overdue = allItems.filter(it => {
    if(!it.due_date || it.done) return false;
    const d = new Date(it.due_date+'T12:00:00'); d.setHours(0,0,0,0);
    return d < today;
  });
  if(dueToday.length > 0){
    new Notification('JAVAL — Tareas para hoy', {
      body: dueToday.map(it=>it.projName+': '+it.text).join('\n'),
      icon: ''
    });
  }
  if(overdue.length > 0){
    new Notification('JAVAL — Tareas vencidas', {
      body: overdue.length+' tarea'+(overdue.length>1?'s':'')+' sin completar vencida'+(overdue.length>1?'s':''),
      icon: ''
    });
  }
}
